<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تفاصيل المنتج | الشيخ للأنظمة الأمنية والحلول الذكية</title>

  <!-- Google Analytics 4 (G-PMT7CG9FER) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-PMT7CG9FER"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-PMT7CG9FER');
  </script>

  <!-- Meta Pixel (2593953414436192) -->
  <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');

  <noscript>
    <img height="1" width="1" style="display:none"
      src="https://www.facebook.com/tr?id=2593953414436192&ev=PageView&noscript=1" />
  </noscript>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    :root {
      --primary: #0f294a;
      --primary-dark: #09192e;
      --accent: #d97706;
      --accent-hover: #b45309;
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --success: #15803d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Cairo', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 16px;
    }

    header {
      background: var(--primary-dark);
      color: #fff;
      padding: 14px 0;
      margin-bottom: 22px;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand-link {
      color: #fff;
      text-decoration: none;
      font-weight: 800;
      font-size: 1.05rem;
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
      transition: 0.2s ease;
    }

    .btn-accent { background: var(--accent); color: #fff; }
    .btn-accent:hover { background: var(--accent-hover); }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-outline {
      background: #fff;
      color: var(--primary-dark);
      border: 1px solid var(--border);
    }

    .product-layout {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
      gap: 22px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
    }

    .main-img-box {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 14px;
      height: 360px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .main-img-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .thumbs-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 12px;
    }

    .thumb-btn {
      background: #f8fafc;
      border: 2px solid var(--border);
      border-radius: 10px;
      height: 78px;
      padding: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .thumb-btn.active { border-color: var(--accent); }
    .thumb-btn img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .video-section {
      margin-top: 16px;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
    }

    .video-frame-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 10px;
      overflow: hidden;
      background: #09192e;
      margin-top: 10px;
    }

    .video-frame-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .badge-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 8px;
    }

    .badge {
      background: #eef2ff;
      padding: 4px 10px;
      border-radius: 999px;
    }

    .price-box {
      font-size: 1.45rem;
      font-weight: 900;
      color: var(--success);
      margin: 10px 0;
    }

    .shipping-note {
      background: #fffbeb;
      border: 1px solid #fde68a;
      color: #92400e;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .specs-table {
      width: 100%;
      border-collapse: collapse;
      margin: 14px 0 18px;
      font-size: 0.9rem;
    }

    .specs-table td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
    }

    .specs-table td:first-child {
      font-weight: 700;
      color: var(--muted);
      width: 40%;
    }

    .actions-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .qty-box {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      background: #fff;
    }

    .qty-box button {
      width: 36px;
      height: 40px;
      border: none;
      background: #f1f5f9;
      font-weight: 800;
      cursor: pointer;
    }

    .qty-box span {
      padding: 0 14px;
      font-weight: 800;
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      padding: 24px 16px;
    }
  </style>
</head>
<body>
  <header>
    <div class="container header-inner">
      <a class="brand-link" href="index.html">الشيخ للأنظمة الأمنية والحلول الذكية</a>
      <a class="btn btn-outline" href="index.html">العودة إلى المتجر</a>
    </div>
  </header>

  <main class="container">
    <div id="productContainer">جاري تحميل بيانات المنتج...</div>
  </main>

  <footer>
    الشيخ للأنظمة الأمنية والحلول الذكية • مصر • واتساب: 01012033762
  </footer>

  <script>
    const WHATSAPP_NUMBER = '201012033762';
    const SHIPPING_FEE = 100;
    const CURRENCY = 'EGP';
    const CART_KEY = 'elsheikh_cart_v1';

    function formatEGP(num) {
      return `${Number(num || 0).toLocaleString('ar-EG')} ج.م`;
    }

    function getProductIdFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get('id');
    }

    // تحويل رابط يوتيوب العادي أو القصير إلى رابط تضمين إن أمكن، مع الاحتفاظ بالرابط الأصلي للمشاهدة المباشرة
    function getYoutubeEmbedUrl(rawUrl) {
      if (!rawUrl) return '';
      const trimmed = String(rawUrl).trim();
      const shortMatch = trimmed.match(/youtu\.be\/([A-Za-z0-9_-]+)/);
      if (shortMatch) return `https://www.youtube.com/embed/${shortMatch[1]}`;
      const watchMatch = trimmed.match(/[?&]v=([A-Za-z0-9_-]+)/);
      if (watchMatch) return `https://www.youtube.com/embed/${watchMatch[1]}`;
      if (trimmed.includes('/embed/')) return trimmed;
      return '';
    }

    function buildFourPlusImages(product) {
      const rawImgs = Array.isArray(product.images) && product.images.length
        ? product.images.filter(Boolean)
        : ['images/logo.png'];

      const gallery = [...rawImgs];
      while (gallery.length < 4) {
        gallery.push(rawImgs[gallery.length % rawImgs.length] || 'images/logo.png');
      }
      return gallery;
    }

    function addProductToCart(product, qty) {
      const cart = JSON.parse(localStorage.getItem(CART_KEY) || '[]');
      const existing = cart.find(i => String(i.id) === String(product.id));
      if (existing) {
        existing.qty += qty;
      } else {
        cart.push({
          id: product.id,
          title: product.title,
          price: Number(product.price) || 0,
          image: (product.images && product.images[0]) || 'images/logo.png',
          qty
        });
      }
      localStorage.setItem(CART_KEY, JSON.stringify(cart));

      if (typeof gtag === 'function') {
        gtag('event', 'add_to_cart', {
          currency: CURRENCY,
          value: Number(product.price || 0) * qty,
          items: [{ item_id: String(product.id), item_name: product.title, price: Number(product.price || 0), quantity: qty }]
        });
      }
      if (typeof fbq === 'function') {
        fbq('track', 'AddToCart', {
          content_ids: [String(product.id)],
          content_name: product.title,
          value: Number(product.price || 0) * qty,
          currency: CURRENCY
        });
      }
      alert('تمت إضافة المنتج إلى السلة بنجاح.');
    }

    function renderProduct(product) {
      document.title = `${product.title} | الشيخ للأنظمة الأمنية والحلول الذكية`;

      const galleryImgs = buildFourPlusImages(product);
      const brand = product.brand || 'الشيخ للأنظمة الأمنية والحلول الذكية';
      const specsEntries = product.specs && typeof product.specs === 'object' ? Object.entries(product.specs) : [];

      /* ضع رابط الفيديو الخاص بالمنتج هنا في ملف products.json داخل الحقل "video_url" (رابط يوتيوب أو رابط فيديو من موقع المنتج) */
      const productVideoUrl = product.video_url || '';
      const embedUrl = getYoutubeEmbedUrl(productVideoUrl);

      const videoBlockHtml = productVideoUrl
        ? `
          <div class="video-section">
            <div style="font-weight:800; color:var(--primary-dark); margin-bottom:6px;">فيديو المنتج</div>
            <a class="btn btn-primary" href="${productVideoUrl}" target="_blank" rel="noopener noreferrer">
              مشاهدة الفيديو عبر الرابط الخارجي
            </a>
            ${embedUrl ? `
              <div class="video-frame-wrap">
                <iframe
                  src="${embedUrl}"
                  title="فيديو المنتج"
                  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                  referrerpolicy="strict-origin-when-cross-origin"
                  allowfullscreen>
                </iframe>
              </div>
            ` : ''}
          </div>
        `
        : `
          <div class="video-section">
            <div style="font-weight:800; color:var(--primary-dark);">فيديو المنتج</div>
            <div style="font-size:0.85rem; color:var(--muted); margin-top:4px;">
              <!-- ضع رابط الفيديو الخاص بالمنتج هنا في products.json عبر الحقل "video_url" -->
              سيتم إضافة رابط الفيديو الخاص بهذا المنتج قريباً.
            </div>
          </div>
        `;

      const waText = encodeURIComponent(
        `مرحباً الشيخ للأنظمة الأمنية والحلول الذكية، أرغب في طلب المنتج: ${product.title}\nالسعر: ${formatEGP(product.price)}\nالشحن الثابت داخل مصر: ${SHIPPING_FEE} ج.م`
      );

      document.getElementById('productContainer').innerHTML = `
        <section class="product-layout">
          <div>
            <div class="main-img-box">
              <img id="mainImg" src="${galleryImgs[0]}" alt="${product.title}" onerror="this.src='images/logo.png'" />
            </div>

            <div class="thumbs-grid" id="thumbsGrid">
              ${galleryImgs.map((src, idx) => `
                <button type="button" class="thumb-btn ${idx === 0 ? 'active' : ''}" data-src="${src}">
                  <img src="${src}" alt="${product.title} - صورة ${idx + 1}" onerror="this.src='images/logo.png'" />
                </button>
              `).join('')}
            </div>

            ${videoBlockHtml}
          </div>

          <div>
            <div class="badge-row">
              <span class="badge">${product.category || 'منتجات'}</span>
              <span class="badge">${brand}</span>
              <span class="badge">التوصيل في مصر</span>
            </div>

            <h1 style="font-size:1.45rem; font-weight:900; color:var(--primary-dark);">${product.title}</h1>
            <div class="price-box">${formatEGP(product.price)}</div>

            <div class="shipping-note">
              مصاريف الشحن الثابتة داخل مصر: ${SHIPPING_FEE} ج.م • متاح الدفع عند الاستلام وفودافون كاش وإنستا باي
            </div>

            <p style="margin-bottom:12px;">${product.description || product.short_spec || ''}</p>

            ${specsEntries.length ? `
              <h2 style="font-size:1rem; font-weight:800; color:var(--primary-dark); margin-top:10px;">المواصفات الكاملة</h2>
              <table class="specs-table">
                <tbody>
                  ${specsEntries.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('')}
                </tbody>
              </table>
            ` : ''}

            <div class="actions-row">
              <div class="qty-box">
                <button type="button" id="decQty">-</button>
                <span id="qtyVal">1</span>
                <button type="button" id="incQty">+</button>
              </div>
              <button type="button" class="btn btn-accent" id="addCartBtn">أضف إلى السلة</button>
              <a class="btn btn-primary" href="https://wa.me/${WHATSAPP_NUMBER}?text=${waText}" target="_blank" rel="noopener noreferrer">
                طلب عبر واتساب
              </a>
            </div>
          </div>
        </section>
      `;

      let qty = 1;
      const qtyVal = document.getElementById('qtyVal');
      document.getElementById('decQty').addEventListener('click', () => {
        if (qty > 1) { qty--; qtyVal.textContent = qty; }
      });
      document.getElementById('incQty').addEventListener('click', () => {
        qty++; qtyVal.textContent = qty;
      });
      document.getElementById('addCartBtn').addEventListener('click', () => {
        addProductToCart(product, qty);
      });

      const mainImg = document.getElementById('mainImg');
      const thumbBtns = document.querySelectorAll('.thumb-btn');
      thumbBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          mainImg.src = btn.dataset.src;
          thumbBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
        });
      });

      if (typeof gtag === 'function') {
        gtag('event', 'view_item', {
          currency: CURRENCY,
          value: Number(product.price || 0),
          items: [{ item_id: String(product.id), item_name: product.title, price: Number(product.price || 0) }]
        });
      }
      if (typeof fbq === 'function') {
        fbq('track', 'ViewContent', {
          content_ids: [String(product.id)],
          content_name: product.title,
          value: Number(product.price || 0),
          currency: CURRENCY
        });
      }
    }

    async function initProductPage() {
      const id = getProductIdFromUrl();
      try {
        const res = await fetch('products.json', { cache: 'no-store' });
        const data = await res.json();
        const list = Array.isArray(data) ? data : (data.products || []);
        const found = list.find(p => String(p.id) === String(id)) || list[0];
        if (!found) {
          document.getElementById('productContainer').innerHTML = '<p>المنتج غير متوفر حالياً.</p>';
          return;
        }
        renderProduct(found);
      } catch (e) {
        document.getElementById('productContainer').innerHTML = '<p>تعذر تحميل بيانات المنتج.</p>';
      }
    }

    initProductPage();
  </script>
</body>
</html>
