<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --primary: #0f294a;
      --primary-dark: #09192e;
      --accent: #d97706;
      --accent-hover: #b45309;
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --success: #15803d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Cairo', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 16px;
    }

    header {
      background: var(--primary-dark);
      color: #fff;
      padding: 14px 0;
      margin-bottom: 22px;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand-link {
      color: #fff;
      text-decoration: none;
      font-weight: 800;
      font-size: 1.05rem;
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
      transition: 0.2s ease;
    }

    .btn-accent { background: var(--accent); color: #fff; }
    .btn-accent:hover { background: var(--accent-hover); }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-outline {
      background: #fff;
      color: var(--primary-dark);
      border: 1px solid var(--border);
    }

    .product-layout {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
      gap: 22px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
    }

    .main-img-box {
      position: relative;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 14px;
      height: 360px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow: hidden;
      cursor: zoom-in;
    }

    .main-img-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      transition: transform 0.12s ease-out;
      transform-origin: center center;
      user-select: none;
    }

    .main-img-box.zoomed img {
      transform: scale(2.1);
    }

    .zoom-hint {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(9, 25, 46, 0.78);
      color: #fff;
      font-size: 0.76rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      pointer-events: none;
    }

    .thumbs-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 12px;
    }

    .thumb-btn {
      background: #f8fafc;
      border: 2px solid var(--border);
      border-radius: 10px;
      height: 78px;
      padding: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.12s ease;
    }

    .thumb-btn.active { border-color: var(--accent); }
    .thumb-btn img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .lightbox-modal {
      position: fixed;
      inset: 0;
      background: rgba(9, 25, 46, 0.88);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 90;
    }

    .lightbox-modal.open { display: flex; }

    .lightbox-box {
      position: relative;
      background: #fff;
      border-radius: 16px;
      max-width: 820px;
      width: 100%;
      padding: 18px;
      text-align: center;
    }

    .lightbox-close {
      position: absolute;
      top: 12px;
      left: 12px;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: none;
      background: #0f172a;
      color: #fff;
      font-weight: 800;
      cursor: pointer;
    }

    .lightbox-box img {
      max-width: 100%;
      max-height: 70vh;
      object-fit: contain;
      border-radius: 10px;
    }

    .video-section {
      margin-top: 16px;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
    }

    .video-frame-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 10px;
      overflow: hidden;
      background: #09192e;
      margin-top: 10px;
    }

    .video-frame-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .badge-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 8px;
    }

    .badge {
      background: #eef2ff;
      padding: 4px 10px;
      border-radius: 999px;
    }

    .price-box {
      font-size: 1.45rem;
      font-weight: 900;
      color: var(--success);
      margin: 10px 0;
    }

    .shipping-note {
      background: #fffbeb;
      border: 1px solid #fde68a;
      color: #92400e;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .specs-table {
      width: 100%;
      border-collapse: collapse;
      margin: 14px 0 18px;
      font-size: 0.9rem;
    }

    .specs-table td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
    }

    .specs-table td:first-child {
      font-weight: 700;
      color: var(--muted);
      width: 40%;
    }

    .actions-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .qty-box {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      background: #fff;
    }

    .qty-box button {
      width: 36px;
      height: 40px;
      border: none;
      background: #f1f5f9;
      font-weight: 800;
      cursor: pointer;
    }

    .qty-box span {
      padding: 0 14px;
      font-weight: 800;
    }

    .not-found-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      text-align: center;
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      padding: 24px 16px;
    }
  </style>
</head>
<body>
  <header>
    <div class="container header-inner">
      <a class="brand-link" href="index.html">الشيخ للأنظمة الأمنية والحلول الذكية</a>
      <a class="btn btn-outline" href="index.html">العودة إلى المتجر</a>
    </div>
  </header>

  <main class="container">
    <div id="productContainer">جاري تحميل بيانات المنتج...</div>
  </main>

  <div id="lightboxModal" class="lightbox-modal" aria-hidden="true">
    <div class="lightbox-box">
      <button type="button" class="lightbox-close" id="closeLightboxBtn">✕</button>
      <img id="lightboxImg" src="" alt="تكبير صورة المنتج" />
    </div>
  </div>

  <footer>
    الشيخ للأنظمة الأمنية والحلول الذكية • مصر • elsheikh.systems.eg@gmail.com
  </footer>

  <script>
    // ضع هنا نفس رابط CSV المنشور من Google Sheets الموجود في index.html
    const GOOGLE_SHEETS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ8KcmaqiDk_u8vcjoZJjw5XveGIUA6xHp1T53M4B-pFXjmxSrxjfZNRWgAqLa-OGF-4dSablRMKDtl/pub?output=csv';
    const FALLBACK_JSON_URL = 'products.json';

    const WHATSAPP_NUMBER = '201012033762';
    const SHIPPING_FEE = 100;
    const CURRENCY = 'EGP';
    const CART_KEY = 'elsheikh_cart_v1';

    function formatEGP(num) {
      return `${Number(num || 0).toLocaleString('ar-EG')} ج.م`;
    }

    function getProductIdFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return (params.get('id') || '').trim();
    }

    function parseCsvRows(csvText) {
      const rows = [];
      let row = [];
      let field = '';
      let inQuotes = false;

      for (let i = 0; i < csvText.length; i++) {
        const ch = csvText[i];
        const next = csvText[i + 1];
        if (ch === '"' && inQuotes && next === '"') {
          field += '"';
          i++;
        } else if (ch === '"') {
          inQuotes = !inQuotes;
        } else if (ch === ',' && !inQuotes) {
          row.push(field.trim());
          field = '';
        } else if ((ch === '\n' || ch === '\r') && !inQuotes) {
          if (ch === '\r' && next === '\n') i++;
          row.push(field.trim());
          if (row.some(cell => cell !== '')) rows.push(row);
          row = [];
          field = '';
        } else {
          field += ch;
        }
      }
      if (field.length > 0 || row.length > 0) {
        row.push(field.trim());
        if (row.some(cell => cell !== '')) rows.push(row);
      }
      return rows;
    }

    function parseSpecsCell(rawSpecs) {
      if (!rawSpecs) return {};
      if (typeof rawSpecs === 'object') return rawSpecs;
      const trimmed = String(rawSpecs).trim();
      if (!trimmed) return {};
      if (trimmed.startsWith('{')) {
        try { return JSON.parse(trimmed); } catch (_) { return {}; }
      }
      const obj = {};
      trimmed.split('|').forEach(pair => {
        const idx = pair.indexOf(':');
        if (idx > -1) {
          const k = pair.slice(0, idx).trim();
          const v = pair.slice(idx + 1).trim();
          if (k && v) obj[k] = v;
        }
      });
      return obj;
    }

    function mapSheetRowsToProducts(rows) {
      if (!rows.length) return [];
      const headers = rows[0].map(h => h.trim().toLowerCase());
      return rows.slice(1).map((r, index) => {
        const obj = {};
        headers.forEach((h, idx) => { obj[h] = r[idx] || ''; });
        const imgs = (obj.images || '')
          .split(/[\n,]/)
          .map(s => s.trim())
          .filter(Boolean);
        const numericPrice = Number(String(obj.price || '0').replace(/[^0-9.]/g, '')) || 0;
        return {
          id: (obj.id || `prod-${index + 1}`).trim(),
          title: (obj.title || '').trim(),
          category: (obj.category || '').trim(),
          price: numericPrice,
          short_spec: (obj.short_spec || '').trim(),
          description: (obj.description || '').trim(),
          images: imgs,
          video_url: (obj.video_url || '').trim(),
          specs: parseSpecsCell(obj.specs)
        };
      }).filter(p => p.title);
    }

    async function loadProductsList() {
      if (GOOGLE_SHEETS_CSV_URL && GOOGLE_SHEETS_CSV_URL.trim()) {
        const res = await fetch(GOOGLE_SHEETS_CSV_URL.trim(), { cache: 'no-store' });
        if (!res.ok) throw new Error('Sheet fetch failed');
        const csvText = await res.text();
        return mapSheetRowsToProducts(parseCsvRows(csvText));
      }
      const res = await fetch(FALLBACK_JSON_URL, { cache: 'no-store' });
      const data = await res.json();
      return Array.isArray(data) ? data : (data.products || []);
    }

    function extractYoutubeId(rawUrl) {
      if (!rawUrl) return '';
      const trimmed = String(rawUrl).trim();
      const embedMatch = trimmed.match(/youtube\.com\/embed\/([A-Za-z0-9_-]+)/);
      if (embedMatch) return embedMatch[1];
      const shortMatch = trimmed.match(/youtu\.be\/([A-Za-z0-9_-]+)/);
      if (shortMatch) return shortMatch[1];
      const watchMatch = trimmed.match(/[?&]v=([A-Za-z0-9_-]+)/);
      if (watchMatch) return watchMatch[1];
      return '';
    }

    function getYoutubeEmbedUrl(rawUrl) {
      const vid = extractYoutubeId(rawUrl);
      if (vid) return `https://www.youtube.com/embed/${vid}`;
      if (rawUrl && String(rawUrl).includes('/embed/')) return String(rawUrl).trim();
      return '';
    }

    function getExternalVideoWatchUrl(rawUrl) {
      const vid = extractYoutubeId(rawUrl);
      if (vid) return `https://www.youtube.com/watch?v=${vid}`;
      return String(rawUrl || '').trim();
    }

    function buildFourPlusImages(product) {
      const rawImgs = Array.isArray(product.images) && product.images.length
        ? product.images.filter(Boolean)
        : (product.image ? [product.image] : ['images/logo.png']);

      const gallery = [...rawImgs];
      while (gallery.length < 4) {
        gallery.push(rawImgs[gallery.length % rawImgs.length] || 'images/logo.png');
      }
      return gallery;
    }

    function addProductToCart(product, qty) {
      const cart = JSON.parse(localStorage.getItem(CART_KEY) || '[]');
      const existing = cart.find(i => String(i.id) === String(product.id));
      if (existing) {
        existing.qty += qty;
      } else {
        cart.push({
          id: product.id,
          title: product.title,
          price: Number(product.price) || 0,
          image: (product.images && product.images[0]) || 'images/logo.png',
          qty
        });
      }
      localStorage.setItem(CART_KEY, JSON.stringify(cart));

      if (typeof gtag === 'function') {
        gtag('event', 'add_to_cart', {
          currency: CURRENCY,
          value: Number(product.price || 0) * qty,
          items: [{ item_id: String(product.id), item_name: product.title, price: Number(product.price || 0), quantity: qty }]
        });
      }
      if (typeof fbq === 'function') {
        fbq('track', 'AddToCart', {
          content_ids: [String(product.id)],
          content_name: product.title,
          value: Number(product.price || 0) * qty,
          currency: CURRENCY
        });
      }
      alert('تمت إضافة المنتج إلى السلة بنجاح.');
    }

    function renderNotFound(requestedId) {
      document.getElementById('productContainer').innerHTML = `
        <div class="not-found-box">
          <h1 style="font-size:1.25rem; font-weight:900; color:var(--primary-dark); margin-bottom:8px;">
            لم يتم العثور على المنتج المطلوب
          </h1>
          <p style="color:var(--muted); margin-bottom:16px;">
            المعرّف المطلوب: <strong>${requestedId || 'غير محدد'}</strong> — تأكد من تطابق قيمة <code>id</code> في جدول Google Sheets أو <code>products.json</code>.
          </p>
          <a class="btn btn-primary" href="index.html">العودة إلى صفحة المتجر</a>
        </div>
      `;
    }

    function renderProduct(product) {
      document.title = `${product.title} | الشيخ للأنظمة الأمنية والحلول الذكية`;

      const galleryImgs = buildFourPlusImages(product);
      galleryImgs.forEach((src) => {
        const pre = new Image();
        pre.src = src;
      });

      const specsEntries = product.specs && typeof product.specs === 'object' ? Object.entries(product.specs) : [];

      const rawVideoCell = String(product.video_url || '').trim();
      const videoList = rawVideoCell
        ? rawVideoCell.split(/[\n,]+/).map(u => u.trim()).filter(Boolean)
        : [];

      const videoCardsHtml = videoList
        .map((rawUrl, index) => {
          const embedUrl = getYoutubeEmbedUrl(rawUrl);
          if (!embedUrl) return '';
          return `
            <div class="video-frame-wrap" style="margin-top:${index === 0 ? '8px' : '12px'};">
              <iframe
                src="${embedUrl}"
                title="فيديو المنتج ${index + 1}"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin"
                allowfullscreen>
              </iframe>
            </div>
          `;
        })
        .filter(Boolean)
        .join('');

      const videoBlockHtml = videoCardsHtml
        ? `
          <div class="video-section">
            <div style="font-weight:800; color:var(--primary-dark); margin-bottom:6px;">فيديو المنتج</div>
            ${videoCardsHtml}
          </div>
        `
        : `
          <div class="video-section">
            <div style="font-weight:800; color:var(--primary-dark);">فيديو المنتج</div>
            <div style="font-size:0.85rem; color:var(--muted); margin-top:4px;">
              سيتم إضافة رابط الفيديو الخاص بهذا المنتج قريباً.
            </div>
          </div>
        `;
        `
        : `
          <div class="video-section">
            <div style="font-weight:800; color:var(--primary-dark);">فيديو المنتج</div>
            <div style="font-size:0.85rem; color:var(--muted); margin-top:4px;">
              سيتم إضافة رابط الفيديو الخاص بهذا المنتج قريباً.
            </div>
          </div>
        `;

      const waText = encodeURIComponent(
        `مرحباً الشيخ للأنظمة الأمنية والحلول الذكية، أرغب في طلب المنتج: ${product.title}\nالسعر: ${formatEGP(product.price)}\nالشحن الثابت داخل مصر: ${SHIPPING_FEE} ج.م`
      );

      document.getElementById('productContainer').innerHTML = `
        <section class="product-layout">
          <div>
            <div class="main-img-box" id="mainImgBox" title="حرّك للتقريب أو اضغط للتكبير الكامل">
              <img id="mainImg" src="${galleryImgs[0]}" alt="${product.title}" onerror="this.src='images/logo.png'" />
              <span class="zoom-hint">مرّر للتقريب • اضغط للتكبير</span>
            </div>

            <div class="thumbs-grid" id="thumbsGrid">
              ${galleryImgs.map((src, idx) => `
                <button type="button" class="thumb-btn ${idx === 0 ? 'active' : ''}" data-src="${src}">
                  <img src="${src}" alt="${product.title} - صورة ${idx + 1}" onerror="this.src='images/logo.png'" />
                </button>
              `).join('')}
            </div>

            ${videoBlockHtml}
          </div>

          <div>
            <div class="badge-row">
              <span class="badge">${product.category || 'منتجات'}</span>
              <span class="badge">الشيخ للأنظمة الأمنية والحلول الذكية</span>
              <span class="badge">التوصيل في مصر</span>
            </div>

            <h1 style="font-size:1.45rem; font-weight:900; color:var(--primary-dark);">${product.title}</h1>
            <div class="price-box">${formatEGP(product.price)}</div>

            <div class="shipping-note">
              مصاريف الشحن الثابتة داخل مصر: ${SHIPPING_FEE} ج.م • متاح الدفع عند الاستلام وفودافون كاش وإنستا باي
            </div>

            <p style="margin-bottom:12px;">${product.description || product.short_spec || ''}</p>

            ${specsEntries.length ? `
              <h2 style="font-size:1rem; font-weight:800; color:var(--primary-dark); margin-top:10px;">المواصفات الكاملة</h2>
              <table class="specs-table">
                <tbody>
                  ${specsEntries.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('')}
                </tbody>
              </table>
            ` : ''}

            <div class="actions-row">
              <div class="qty-box">
                <button type="button" id="decQty">-</button>
                <span id="qtyVal">1</span>
                <button type="button" id="incQty">+</button>
              </div>
              <button type="button" class="btn btn-accent" id="addCartBtn">أضف إلى السلة</button>
              <a class="btn btn-primary" href="https://wa.me/${WHATSAPP_NUMBER}?text=${waText}" target="_blank" rel="noopener noreferrer">
                طلب عبر واتساب
              </a>
            </div>
          </div>
        </section>
      `;

      let qty = 1;
      const qtyVal = document.getElementById('qtyVal');
      document.getElementById('decQty').addEventListener('click', () => {
        if (qty > 1) { qty--; qtyVal.textContent = qty; }
      });
      document.getElementById('incQty').addEventListener('click', () => {
        qty++; qtyVal.textContent = qty;
      });
      document.getElementById('addCartBtn').addEventListener('click', () => {
        addProductToCart(product, qty);
      });

      const mainImgBox = document.getElementById('mainImgBox');
      const mainImg = document.getElementById('mainImg');
      const thumbBtns = document.querySelectorAll('.thumb-btn');
      const lightboxModal = document.getElementById('lightboxModal');
      const lightboxImg = document.getElementById('lightboxImg');
      const closeLightboxBtn = document.getElementById('closeLightboxBtn');

      thumbBtns.forEach(btn => {
        const switchHandler = () => {
          const nextSrc = btn.dataset.src;
          if (mainImg.getAttribute('src') !== nextSrc) {
            mainImg.setAttribute('src', nextSrc);
          }
          thumbBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
        };
        btn.addEventListener('mouseenter', switchHandler);
        btn.addEventListener('click', switchHandler);
      });

      mainImgBox.addEventListener('mousemove', (e) => {
        const rect = mainImgBox.getBoundingClientRect();
        const xPct = ((e.clientX - rect.left) / rect.width) * 100;
        const yPct = ((e.clientY - rect.top) / rect.height) * 100;
        mainImg.style.transformOrigin = `${xPct}% ${yPct}%`;
        mainImgBox.classList.add('zoomed');
      });

      mainImgBox.addEventListener('mouseleave', () => {
        mainImgBox.classList.remove('zoomed');
        mainImg.style.transformOrigin = 'center center';
      });

      mainImgBox.addEventListener('click', () => {
        lightboxImg.src = mainImg.getAttribute('src');
        lightboxModal.classList.add('open');
      });

      closeLightboxBtn.addEventListener('click', () => {
        lightboxModal.classList.remove('open');
      });

      lightboxModal.addEventListener('click', (e) => {
        if (e.target === lightboxModal) lightboxModal.classList.remove('open');
      });

      if (typeof gtag === 'function') {
        gtag('event', 'view_item', {
          currency: CURRENCY,
          value: Number(product.price || 0),
          items: [{ item_id: String(product.id), item_name: product.title, price: Number(product.price || 0) }]
        });
      }
      if (typeof fbq === 'function') {
        fbq('track', 'ViewContent', {
          content_ids: [String(product.id)],
          content_name: product.title,
          value: Number(product.price || 0),
          currency: CURRENCY
        });
      }
    }

    async function initProductPage() {
      const requestedId = getProductIdFromUrl();
      try {
        const list = await loadProductsList();
        const normalizedTarget = requestedId.toLowerCase();
        const found = list.find(p => String(p.id || '').trim().toLowerCase() === normalizedTarget);

        if (!found) {
          renderNotFound(requestedId);
          return;
        }
        renderProduct(found);
      } catch (e) {
        document.getElementById('productContainer').innerHTML = '<p>تعذر تحميل بيانات المنتج.</p>';
      }
    }

    initProductPage();
  </script>
</body>
</html>
